# 主仓库 CI（P0 工程治理）。
# 与 testgen 八环门禁 testgen-gate.yml **保持分离**（各自独立 job，规则互不拖累，见 CODE_STANDARDS §5）。
#
# 检查分两档：
#   - 必需（main 分支保护要求的 status check）：通过 job 名引用。
#       * pr-lint        —— PR 标题符合 CODE_STANDARDS §4.1 约定，零依赖、恒定可用。
#       * gate           —— 来自 testgen-gate.yml（八环质量门禁），在 main 的每次 PR 上必现。
#       * django-tests   —— sqlite test settings，已知绿范围（tests + ui_automation + llm_judge），362 passed。
#       * frontend-lint  —— ESLint，0 error 基线（prettier 已从 ESLint 规则通道移除，见 .eslintrc.cjs 注释）。
#   - 建议（advisory，continue-on-error，不纳入必需检查）：
#       * 暂无。存量 vue 模板风格 warn（attributes-order 等）不阻断，保留可见，见 docs/GOVERNANCE_P0.md。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # PR 标题约定校验：<type>: <描述>，type ∈ CODE_STANDARDS §4.1 固定集合（英文小写）
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf 'PR title: %s\n' "$TITLE"
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|perf|test|style|chore|ci|revert): .+'; then
            echo "::error::PR 标题须符合 '<type>: <描述>'，type ∈ {feat,fix,docs,refactor,perf,test,style,chore,ci,revert}（见 CODE_STANDARDS §4.1）"
            exit 1
          fi
          echo "PR title OK"

  # Django 测试（test_settings 用 sqlite / 内存 Channel / locmem，无需 MySQL/Redis）
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Run Django tests (canonical green scope)"
        env:
          DJANGO_SETTINGS_MODULE: backend.test_settings
          # backend/test_settings.py 里 `from backend.settings import *`，而 settings 在
          # DEBUG=False 时对 SECRET_KEY 缺失 fail-fast（H2 修复）。CI 没有 .env，
          # 所以这里给一个仅供测试的占位值——不是密钥，也不进任何运行时路径。
          SECRET_KEY: ci-test-only-placeholder-not-a-real-secret
          DEBUG: "1"
        # 必须用 `python -m pytest`：裸 `pytest` 的 sys.path[0] 是 pytest 脚本所在目录，
        # 不含仓库根，导致 `import apps.*` 全部 ModuleNotFoundError。
        run: python -m pytest tests apps/ui_automation/tests apps/llm_judge/tests -q

  # 前端 ESLint：只管正确性（0 error 基线）。格式检查走 Prettier，不占本 job。
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 用 npm run lint 而不是内联命令：保证本地与 CI 完全同一套参数（无 --fix）。
      - name: ESLint
        run: npm run lint

  # 密钥泄漏守卫（#275）：.env.bak 曾含明文凭据被推送到公开仓库（见
  # docs/security_env_bak_remediation_2026-10-30.md）。本 job 扫描「被跟踪」文件，
  # 命中即失败，防止同类泄漏再次发生。模式高信号、低误报（已排除 .env.example）。
  # 当前为 advisory（未纳入分支保护必需检查）；建议后续在分支保护中加入本 check 升级为必需。
  #
  # 私钥块判定要求「同文件同时存在 -----BEGIN 与 -----END 私钥标记」（真实 PEM
  # 私钥必然成对），避免误伤：扫描器自身源码 / 测试样例里把该模式当字符串引用的
  # 单行 BEGIN（无 END）不应报漏。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan tracked files for leaked secrets
        run: |
          set -euo pipefail
          echo "== 检查被跟踪的 .env* / *.bak（.env.example 除外）=="
          leaks=$(git ls-files | grep -E '(\.env($|\.)|\.bak$)' | grep -vE '\.env\.example$' || true)
          if [ -n "$leaks" ]; then
            echo "::error::发现疑似密钥/备份文件被跟踪，禁止入库："
            echo "$leaks"
            exit 1
          fi
          echo "== 检查完整 PEM 私钥块（须同文件同时存在 -----BEGIN 与 -----END 标记）=="
          keyleaks=$(git ls-files -z | while IFS= read -r -d '' f; do
            # 排除 CI 配置目录：非密钥载体，且含本扫描器自身源码（字面引用上述模式），
            # 否则会自引用误报。真实私钥永不落于 .github/workflows/，排除不削弱防护。
            case "$f" in
              .github/workflows/*) continue ;;
            esac
            if grep -IqP -e '-----BEGIN .*PRIVATE KEY-----' "$f" && grep -IqP -e '-----END .*PRIVATE KEY-----' "$f"; then
              printf '%s\n' "$f"
            fi
          done)
          if [ -n "${keyleaks:-}" ]; then
            echo "::error::发现完整 PEM 私钥块被跟踪："
            printf '%s\n' "$keyleaks"
            exit 1
          fi
          echo "secret-scan OK：未发现被跟踪的密钥/备份文件或私钥块"
