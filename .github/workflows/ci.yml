# 主仓库 CI（P0 工程治理）。
# 与 testgen 八环门禁 testgen-gate.yml **保持分离**（各自独立 job，规则互不拖累，见 CODE_STANDARDS §5）。
#
# 检查分两档：
#   - 必需（main 分支保护要求的 status check）：通过 job 名引用。
#       * pr-lint   —— PR 标题符合 CODE_STANDARDS §4.1 约定，零依赖、恒定可用。
#       * gate      —— 来自 testgen-gate.yml（八环质量门禁），在 main 的每次 PR 上必现。
#   - 建议（advisory，continue-on-error，不纳入必需检查，避免因存量技术债误锁合并）：
#       * django-tests   —— sqlite test settings，跑已知绿范围（tests + ui_automation + llm_judge）。
#       * frontend-lint  —— ESLint（历史配置缺失已补 .eslintrc.cjs；存量 11 处错误为技术债）。
#     待各自在 CI 稳定出绿基线后，再在分支保护中提升为必需检查（见 docs/GOVERNANCE_P0.md）。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # PR 标题约定校验：<type>: <描述>，type ∈ CODE_STANDARDS §4.1 固定集合（英文小写）
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf 'PR title: %s\n' "$TITLE"
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|perf|test|style|chore|ci|revert): .+'; then
            echo "::error::PR 标题须符合 '<type>: <描述>'，type ∈ {feat,fix,docs,refactor,perf,test,style,chore,ci,revert}（见 CODE_STANDARDS §4.1）"
            exit 1
          fi
          echo "PR title OK"

  # Django 测试（test_settings 用 sqlite / 内存 Channel / locmem，无需 MySQL/Redis）
  django-tests:
    continue-on-error: true # 建议项：依赖较重（requirements 含 easyocr→torch、selenium 等），基线稳定后再提升为必需
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Run Django tests (canonical green scope: 263 tests)"
        env:
          DJANGO_SETTINGS_MODULE: backend.test_settings
        run: pytest tests apps/ui_automation/tests apps/llm_judge/tests -q

  # 前端 ESLint（.eslintrc.cjs 由本轮补齐；存量 11 处错误为技术债，先作建议项）
  frontend-lint:
    continue-on-error: true # 建议项：存量 11 处错误修复后再提升为必需
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore
