# testgen 独立质量门禁（M3-3）
# 与 testhub 现有 CI 完全分离：各自 job、各自报告，互不合并（避免规则互相拖累）。
# 仅当 services/testgen 或本 workflow 变更时触发，避免无关提交空跑。
name: testgen-gate

on:
  push:
    branches: [main]
    paths:
      - 'services/testgen/**'
      - '.github/workflows/**'
  # 不按路径过滤：main 分支保护要求 gate 检查在**每次** PR 上必现，
  # 否则仅改前端/后端的 PR 会因缺少 gate 检查而被误锁。
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/testgen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 八环门禁工具：**锁定与本地受管环境一致的版本**，避免 ruff/mypy 版本漂移导致假失败
          # （曾因 CI 装到最新 ruff 而 lint/format 假红）；pytest-timeout 是 addopts `--timeout=120` 的必需插件。
          pip install ruff==0.16.6 mypy==2.3.1 bandit==1.9.4 pytest==8.4.2 pytest-cov pytest-timeout

      - name: Secrets scan (零明文入库红线)
        run: python scripts/check_secrets.py

      - name: Quality gate (8 rings + pytest cov>=60)
        run: python scripts/gate_all.py
