[pytest]
DJANGO_SETTINGS_MODULE = backend.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts = -v --tb=short
# 只收集项目自有测试根，避免根目录 `pytest` 误扫整仓。
# 注意：services/testgen 的测试（含 fastapi 依赖）由独立八环门禁
# testgen-gate.yml 在其工作目录内运行，不属于根 venv 收集范围。
testpaths =
    apps
    tests
# 排除非项目目录（第三方被测仓/legacy/虚拟环境/前端/后端运行时目录），
# 防止模块级 sys.exit、裸连服务、缺 fastapi 等导致 pytest 收集期崩溃。
# 注意：apps/taskcenter 已正式注册进 LOCAL_APPS 并挂载 URL（见下），
# 故不再排除其收集。
norecursedirs =
    .git
    .hg
    .svn
    .venv
    venv
    node_modules
    frontend
    backend
    services
    work
    data
    media
    logs
    allure
    perf_workspace
    docs
    scripts
    templates
    dist
    build
    *.egg-info
